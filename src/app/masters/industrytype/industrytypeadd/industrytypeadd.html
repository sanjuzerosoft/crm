<div class="wrapper">
  <!-- HEADER -->
  <div class="container header-container">
    <div class="header">
      <h1>Add Lead IndustryType</h1>
    </div>

    <!-- FORM -->
  <form
    id="IndustryTypeForm"
    #IndustryTypeForm="ngForm"
    (ngSubmit)="IndustryTypeId ? updateIndustryType(IndustryTypeId) : saveIndustryType()"
  >
    <div class="form-layout single-column">
      
        <!-- IndustryType Name -->
        <div class="form-group">
          <label>IndustryType Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="IndustryType.name"
            #name="ngModel"
            required
            minlength="3"
          />

          <div class="error" *ngIf="name.invalid && (name.dirty || name.touched)">
            <small *ngIf="name.errors?.['required']">Name is required</small>
            <small *ngIf="name.errors?.['minlength']">Minimum 3 characters</small>
          </div>
        </div>        

        <!-- Status -->
        <div class="form-group">
          <label>Status</label>
          <select name="status" [(ngModel)]="IndustryType.status" required>
            <option value="">Select Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
     
    </div>
  </form>

    <!-- ACTIONS -->
    <div class="form-actions">
      <div class="left-action">
        <button type="button" class="btn btn-secondary" (click)="goBack()">← Back</button>
      </div>

      <div class="right-actions">
        <button type="button" class="btn btn-outline" (click)="clearForm()" *ngIf="!IndustryTypeId">
          Clear
        </button>

        <button
          type="submit"
          form="IndustryTypeForm"
          class="btn btn-primary"
          [disabled]="IndustryTypeForm.invalid"
        >
          {{ IndustryTypeId ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  </div>

  
</div>
