<div class="wrapper">
  <div class="container">
    <div class="button-container">
            <button class="red-btn" (click)="assigneeeMaster()">Lead Assignee</button>
            <button class="red-btn" (click)="projectMaster()" routerLink="/IndustryType">Project</button>
            <button class="red-btn-active" (click)="industryMaster()" routerLink="/industry-type">Industry Type</button>
        </div>

    <div class="header">
      <!-- Page Header -->
      <div>
        <div class="page-title">
          Industrytype List -
          <span class="count" style="color: #cd1c18;">{{ totalIndustrytypes?totalIndustrytypes:"0" }}</span>
        </div>
      </div>

      <!-- Toolbar -->
      <div>
        <div class="toolbar">
          <div class="search-box">
            <img src="search.png" alt="Search" class="search-icon" />
            <input
              type="text"
              placeholder="Search Industrytype..."
              [(ngModel)]="searchText"
              (input)="onSearch()"
            />
          </div>

          <button class="add-btn" (click)="addIndustrytype()">
            <img src="add.png" alt="Add" class="btn-icon" />
            Add
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table class="leads-table">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Industrytype Name</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let Industrytypes of Industrytype; let i = index" class="clickable-row">
            <td>{{ i + 1 }}</td>
            <td>{{ Industrytypes.name }}</td>
            <td>
              <span
                class="status"
                [ngClass]="{
                  sucess: Industrytypes.status === 'Active',
                  danger: Industrytypes.status === 'Inactive',
                }"
              >
                {{ Industrytypes.status }}
              </span>
            </td>

            <td class="actions">
              <img
                src="edit.png"
                class="action-icon"
                (click)="editIndustrytype(Industrytypes.id); $event.stopPropagation()"
              />
              <img
                src="delete.png"
                class="action-icon delete"
                (click)="openDeletePopup(Industrytypes.id); $event.stopPropagation()"
              />
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Delete Confirmation Modal -->
      <div class="modal-backdrop" *ngIf="showDeletePopup">
        <div class="modal">
          <h3>Confirm Delete</h3>
          <p>Are you sure you want to delete this Industrytype?</p>

          <div class="modal-actions">
            <button class="btn cancel" (click)="closeDeletePopup()">No</button>
            <button class="btn delete" (click)="confirmDelete()">Yes</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
