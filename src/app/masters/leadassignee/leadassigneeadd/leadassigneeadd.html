<div class="wrapper">
  <!-- HEADER -->
  <div class="container header-container">
    <div class="header">
      <h1>Add Lead Assignee</h1>
    </div>

    <!-- ACTIONS -->
    <div class="form-actions">
      <button type="button" class="red-btn" (click)="goBack()">Back</button>

      <div class="right-actions">
        <button
          type="button"
          class="red-btn"
          (click)="clearForm()"
          *ngIf="!assigneeId"
        >
          Clear
        </button>

        <button
          type="submit"
          form="leadAssigneeForm"
          class="red-btn"
          [disabled]="leadAssigneeForm.invalid"
        >
          {{ assigneeId ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <form
    id="leadAssigneeForm"
    #leadAssigneeForm="ngForm"
    (ngSubmit)="assigneeId ? updateAssignee(assigneeId) : saveAssignee()"
  >
    <div class="form-layout single-column">
      <div class="container">
        <h3 class="card-title">Assignee Details</h3>

        <!-- Assignee Name -->
        <div class="form-group">
          <label>Assignee Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="assignee.name"
            #name="ngModel"
            required
            minlength="3"
          />

          <div class="error" *ngIf="name.invalid && (name.dirty || name.touched)">
            <small *ngIf="name.errors?.['required']">Name is required</small>
            <small *ngIf="name.errors?.['minlength']">Minimum 3 characters</small>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="assignee.email"
            #email="ngModel"
            required
            pattern="^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          />

          <div class="error" *ngIf="email.invalid && (email.dirty || email.touched)">
            <small *ngIf="email.errors?.['required']">Email is required</small>
            <small *ngIf="email.errors?.['pattern']">Invalid email format</small>
          </div>
        </div>

        <!-- Mobile -->
        <div class="form-group">
          <label>Mobile</label>
          <input
            type="text"
            name="mobile"
            [(ngModel)]="assignee.mobile"
            #mobile="ngModel"
            required
            pattern="^[0-9]{10}$"
          />

          <div class="error" *ngIf="mobile.invalid && (mobile.dirty || mobile.touched)">
            <small *ngIf="mobile.errors?.['required']">Mobile is required</small>
            <small *ngIf="mobile.errors?.['pattern']">Enter valid 10-digit number</small>
          </div>
        </div>

        <!-- Role -->
        <div class="form-group">
          <label>Role / Designation</label>
          <input
            type="text"
            name="role"
            [(ngModel)]="assignee.role"
            placeholder="Sales Executive / Manager"
          />
        </div>

        <!-- Status -->
        <div class="form-group">
          <label>Status</label>
          <select name="status" [(ngModel)]="assignee.status" required>
            <option value="">Select Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label>Description</label>
          <textarea
            name="description"
            [(ngModel)]="assignee.description"
            rows="3"
          ></textarea>
        </div>
      </div>
    </div>
  </form>
</div>
