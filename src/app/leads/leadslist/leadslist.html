<div class="wrapper">
  <div class="container">
    <div class="header">
      <!-- Page Header -->
      <div>
        <div class="page-title">
          Leads List - <span class="count" style="color: #cd1c18;">{{ totalLeads?totalLeads:"0" }}</span>
        </div>
      </div>

      <!-- Toolbar -->
      <div>
        <div class="toolbar">
          <div class="search-box">
            <img src="search.png" alt="Search" class="search-icon" />
            <!-- <input type="text" placeholder="Search leads..." /> -->
            <input
              type="text"
              [(ngModel)]="searchText"
              (input)="onSearch()"
              placeholder="Search leads..."
            />
          </div>

          <button class="add-btn" (click)="AddLeads()">
            <img src="add.png" alt="Add" class="btn-icon" />
            Add
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table class="leads-table">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Lead Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let lead of leads; let i = index"
            (click)="viewLead(lead.id)"
            class="clickable-row"
          >
            <td>{{ i + 1 }}</td>
            <td>{{ lead.first_name }}</td>
            <td>{{ lead.email }}</td>
            <td>{{ lead.mobile }}</td>
            <td>
              <span
                class="status"
                [ngClass]="{
                  sucess: lead.lead_status === 'active',
                  danger: lead.lead_status === 'inactive',
                }"
                >{{ lead.lead_status }}</span
              >
            </td>

            <td class="actions">
              <img src="edit.png" class="action-icon" (click)="editLead(lead.id)" />
              <!-- <img src="delete.png" class="action-icon delete" (click)="deleteLead(lead.id)" /> -->
              <img
                src="delete.png"
                class="action-icon delete"
                (click)="openDeletePopup(lead.id); $event.stopPropagation()"
              />
            </td>
          </tr>
        </tbody>
      </table>
      <div class="modal-backdrop" *ngIf="showDeletePopup">
        <div class="modal">
          <h3>Confirm Delete</h3>
          <p>Are you sure you want to delete this lead?</p>

          <div class="modal-actions">
            <button class="btn cancel" (click)="closeDeletePopup()">No</button>
            <button class="btn delete" (click)="confirmDelete()">Yes</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="isLoading" class="page-loader">
    <div class="spinner"></div>
  </div>
</div>
