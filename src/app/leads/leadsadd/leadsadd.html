<div class="wrapper">
  <!-- HEADER -->
  <div class="container header-container">
    <div class="header">
      <h1>Add Lead</h1>
    </div>
    <!-- FORM -->
    <form id="leadForm" #leadForm="ngForm" (ngSubmit)="leadId ? updateLead(leadId) : saveLead()">
      <!-- TWO COLUMN LAYOUT -->
      <div class="form-layout">
        <!-- LEFT -->
        <div class="container left-container">
          <h3 class="card-title">Lead Details</h3>

          <div class="grid-2">
            
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>First Name</label>
              <input
                type="text"
                name="first_name"
                [(ngModel)]="lead.first_name"
                #firstName="ngModel"
                required
                minlength="2"
                pattern="^[a-zA-Z ]+$"
              />

              <div
                class="error"
                *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)"
              >
                <small *ngIf="firstName.errors?.['required']">First name is required</small>
                <small *ngIf="firstName.errors?.['minlength']">Minimum 2 characters</small>
                <small *ngIf="firstName.errors?.['pattern']">Only letters allowed</small>
              </div>
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" name="last_name" [(ngModel)]="lead.last_name" required />
            </div>

            <div class="form-group">
              <label>Lead Assignee</label>
              <select name="lead_assignee" [(ngModel)]="lead.lead_assignee" required="">
                <option value="">Select Assignee</option>
                <option *ngFor="let assignees of assignee" [value]="assignees.id">
                  {{ assignees.name }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                name="email"
                [(ngModel)]="lead.email"
                #email="ngModel"
                required
                pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
              />

              <div class="error" *ngIf="email.invalid && (email.dirty || email.touched)">
                <small *ngIf="email.errors?.['required']">Email is required</small>
                <small *ngIf="email.errors?.['pattern']">Invalid email format</small>
              </div>
            </div>

            <div class="form-group">
              <label>Mobile</label>
              <input
                type="text"
                name="mobile"
                [(ngModel)]="lead.mobile"
                #mobile="ngModel"
                required
                pattern="^[0-9]{10}$"
              />

              <div class="error" *ngIf="mobile.invalid && (mobile.dirty || mobile.touched)">
                <small *ngIf="mobile.errors?.['required']">Mobile number is required</small>
                <small *ngIf="mobile.errors?.['pattern']">Enter valid 10-digit number</small>
              </div>
            </div>

            <div class="form-group">
              <label>Company Name</label>
              <input type="text" name="company_name" [(ngModel)]="lead.company_name" />
            </div>

            <div class="form-group">
              <label>Industry Type</label>
              <select name="industry_type" [(ngModel)]="lead.industry_type" required="">
                <option value="">Select Industry Type</option>
                <option *ngFor="let industrys of industry" [value]="industrys.id">
                  {{ industrys.name }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label>Lead Source</label>
              <input type="text" name="lead_source" [(ngModel)]="lead.lead_source" />
            </div>

            
          </div>
          <div class="form-group">
              <label>Website</label>
              <input
                type="text"
                name="website"
                [(ngModel)]="lead.website"
                #website="ngModel"
                pattern="https?://.+"
              />

              <div class="error" *ngIf="website.invalid && website.touched">
                <small>Enter valid website URL (http/https)</small>
              </div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="container right-container">
          <h3 class="card-title">Address</h3>

          <div class="grid-2">
            <div class="form-group">
              <label>Door No</label>
              <input type="text" name="door_no" [(ngModel)]="lead.door_no" />
            </div>

            <div class="form-group">
              <label>Street</label>
              <input type="text" name="street" [(ngModel)]="lead.street" />
            </div>

            <div class="form-group">
              <label>City</label>
              <input type="text" name="city" [(ngModel)]="lead.city" />
            </div>

            <div class="form-group">
              <label>State</label>
              <input type="text" name="state" [(ngModel)]="lead.state" />
            </div>

            <div class="form-group">
              <label>Country</label>
              <input type="text" name="country" [(ngModel)]="lead.country" />
            </div>

            <div class="form-group">
              <label>Zip Code</label>
              <input
                type="text"
                name="zip_code"
                [(ngModel)]="lead.zip_code"
                #zip="ngModel"
                pattern="^[0-9]{5,6}$"
              />

              <div class="error" *ngIf="zip.invalid && zip.touched">
                <small>Enter valid zip code</small>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea name="description" [(ngModel)]="lead.description"></textarea>
          </div>
        </div>
      </div>
    </form>

    <!-- ACTIONS BELOW HEADER -->
    <div class="form-actions">
      <button type="button" class="btn back" (click)="goBack()">Back</button>

      <div class="right-actions">
        <button type="button" class="btn clear" (click)="clearForm()" *ngIf="!leadId">Clear</button>
        <button type="submit" form="leadForm" class="btn save" [disabled]="leadForm.invalid">
          {{ leadId ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  </div>
</div>
