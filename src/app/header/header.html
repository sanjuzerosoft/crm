<div class="main_header">
  <div class="flex items-center justify-between">
    <!-- LEFT -->
    <div class="flex items-center gap-4">
      <div class="logo_images">
        <img src="favicon.png" class="h-6 w-auto cursor-pointer" alt="Logo" routerLink="/dashboard"/>
      </div>
      <span class="logo_text">ZeroSoft CRM</span>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-4">
      <img src="masters.png" class="header-icon" title="Master" (click)="masters()" />

      <div class="relative">
        <img src="notification.png" class="header-icon" />
        <span class="notification-dot">3</span>
      </div>

      <!-- USER BADGE -->
      <!-- <div class="user-badge" (click)="toggleProfileModal()">
        <div class="user-avatar">A</div>
        <span class="user-text">Welcome Admin!</span>
        <span class="dropdown-icon">▾</span>
      </div> -->
      <!-- USER BADGE -->
      <div class="relative">
        <div class="user-badge" (click)="toggleProfileModal()" aria-haspopup="true">
          <!-- <div class="user-avatar">A</div> -->
          <div class="user-avatar">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#cd1c18"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <span class="user-text"> Admin!</span>
          <span class="dropdown-icon">▾</span>
        </div>

        <!-- PROFILE DROPDOWN -->
        <div class="profile-dropdown" *ngIf="showProfileModal" >
          <div class="dropdown-item" (click)="changePassword()">
            <img src="padlock.png" class="dropdown-icon-img" />
            <span>Change Password</span>
          </div>

          <div class="dropdown-divider"></div>

          <div class="dropdown-item logout" (click)="logout()">
            <img src="exit.png" class="dropdown-icon-img" />
            <span>Logout</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showPasswordModal">
  <div class="password-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Change Password</h3>
      <button class="close-btn" (click)="closePasswordModal()">&times;</button>
    </div>
    <div class="password-modal-content">
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmitPassword()">
        <!-- Email Field (Read-only) -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" [value]="userEmail" readonly />
        </div>

        <!-- Current Password -->
        <div class="form-group">
          <label for="currentPassword">Current Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              id="currentPassword"
              class="form-control"
              formControlName="currentPassword"
              placeholder="Enter current password"
            />
            <button type="button" class="toggle-password" (click)="toggleCurrentPassword()">
              <img
                [src]="showCurrentPassword ? 'hide.png' : 'show.png'"
                alt="Toggle password visibility"
                class="toggle-password-icon"
              />
            </button>
          </div>
          <div
            class="error-message"
            *ngIf="
              passwordForm.get('currentPassword')?.invalid &&
              passwordForm.get('currentPassword')?.touched
            "
          >
            <span *ngIf="passwordForm.get('currentPassword')?.errors?.['required']"
              >Current password is required</span
            >
          </div>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label for="newPassword">New Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              id="newPassword"
              class="form-control"
              formControlName="newPassword"
              placeholder="Enter new password"
            />
            <button type="button" class="toggle-password" (click)="toggleNewPassword()">
              <img
                [src]="showNewPassword ? 'hide.png' : 'show.png'"
                alt="Toggle password visibility"
                class="toggle-password-icon"
              />
            </button>
          </div>
          <div
            class="error-message"
            *ngIf="
              passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched
            "
          >
            <span *ngIf="passwordForm.get('newPassword')?.errors?.['required']"
              >New password is required</span
            >
            <span *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']"
              >Password must be at least 8 characters</span
            >
            <span *ngIf="passwordForm.get('newPassword')?.errors?.['pattern']"
              >Password must contain uppercase, lowercase, number and special character</span
            >
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              class="form-control"
              formControlName="confirmPassword"
              placeholder="Re-enter new password"
            />
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
              <img
                [src]="showConfirmPassword ? 'hide.png' : 'show.png'"
                alt="Toggle password visibility"
                class="toggle-password-icon"
              />
            </button>
          </div>
          <div
            class="error-message"
            *ngIf="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
          >
            <span *ngIf="passwordForm.get('confirmPassword')?.errors?.['required']"
              >Please confirm your password</span
            >
          </div>
          <div
            class="error-message"
            *ngIf="
              passwordForm.errors?.['passwordMismatch'] &&
              passwordForm.get('confirmPassword')?.touched
            "
          >
            <span>Passwords do not match</span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closePasswordModal()">Cancel</button>
          <button type="submit" class="btn-submit" [disabled]="passwordForm.invalid">
            Change Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
